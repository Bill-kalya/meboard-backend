services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meboard
      POSTGRES_PASSWORD: meboard123
      POSTGRES_DB: meboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/me123456
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    environment:
      OLLAMA_HOST: http://ollama:11434
      MEBOARD_LLM_MODEL: llama3
      MEBOARD_LLM_ENABLED: "true"
      MEBOARD_SEMANTIC_MODE: hybrid
    ports:
      - "8000:8000"
    depends_on:
      - ollama

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://meboard:meboard123@postgres:5432/meboard
      REDIS_URL: redis://redis:6379
      JWT_SECRET: meboard-dev-secret-change-me
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  ollama_data:
